<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087ea4">
  <title>Banco Mundo Online • Sem conexão</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07171d;color:#eefbfc;padding:24px}
    main{max-width:520px;text-align:center;background:#10262e;border:1px solid #284954;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0007}
    .logo{width:96px;height:96px;border-radius:24px}
    h1{margin:18px 0 8px}p{color:#b8cbd0;line-height:1.5}
    button{border:0;border-radius:12px;padding:13px 18px;background:#19a8c9;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/icons/icon-192.png" alt="Ícone do Banco Mundo Online">
    <h1>Você está sem conexão</h1>
    <p>A interface pode ser aberta, mas as operações da partida precisam do servidor online para manter saldos, patrimônios e aprovações sincronizados.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
